<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Swar Music - Premium Monochrome Audio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: -0.015em;
        }
        :root {
            --bg-base: #000000;
            --bg-elevated: #0a0a0c;
            --bg-card: rgba(255, 255, 255, 0.04);
            --bg-card-hover: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(10, 10, 12, 0.72);
            --glass-bg-strong: rgba(10, 10, 12, 0.9);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-strong: rgba(255, 255, 255, 0.16);
            --text-base: #ffffff;
            --text-subdued: #8e8e93;
            --text-muted: #48484a;
            --accent: #ffffff;
            --danger: #ff453a;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.25, 1, 0.5, 1.15);
        }
        html, body {
            background: var(--bg-base);
            color: var(--text-base);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }
        body {
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 75%), radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            background-attachment: fixed;
        }
        button { font-family: inherit; outline: none; border: none; background: none; color: inherit; cursor: pointer; }
        input { font-family: inherit; outline: none; border: none; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

        /* Fixed Layout Core - prevents any reflow from text length */
        .app { min-height: 100vh; padding-bottom: 200px; transition: filter 0.4s var(--ease); }
        .app.fs-open { filter: blur(20px) brightness(0.3); pointer-events: none; }

        /* Header & Navigation (unchanged but stable) */
        .header {
            position: sticky; top: 0; z-index: 50; background: var(--glass-bg);
            backdrop-filter: blur(24px); border-bottom: 1px solid var(--glass-border); padding: 18px 24px;
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; cursor: pointer; }
        .brand-icon { width: 32px; height: 32px; background: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px; }
        .brand-icon img { width: 100%; height: 100%; object-fit: contain; }
        .brand-name { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.04em; }
        .search-wrap { flex: 1; max-width: 420px; position: relative; }
        .search-wrap input { width: 100%; padding: 11px 16px 11px 44px; background: rgba(255,255,255,0.06); border: 1px solid transparent; border-radius: 10px; color: #fff; font-size: 0.9rem; transition: all 0.3s var(--ease); }
        .search-wrap input:focus { background: rgba(255,255,255,0.1); border-color: var(--glass-border-strong); }
        .search-icon-svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--text-subdued); }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; font-weight: 700; }

        /* MINI PLAYER - FIXED LAYOUT: TEXT CONTAINER HAS FIXED WIDTH WITH MARQUEE BEHAVIOR */
        .mini-player {
            position: fixed; bottom: 84px; left: 20px; right: 20px; z-index: 40;
            background: var(--glass-bg-strong); backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border-strong); border-radius: 18px; padding: 8px 14px;
            display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.8);
            transform: translateY(120px); opacity: 0; transition: all 0.5s var(--ease);
        }
        .mini-player.visible { transform: translateY(0); opacity: 1; }
        .mini-player-img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        
        /* CRITICAL FIX: fixed-width container for text with marquee overflow */
        .mini-player-info {
            flex: 1 1 auto;
            min-width: 0;         /* allows flex child to shrink */
            max-width: calc(100% - 140px); /* ensures controls area stays intact */
            overflow: hidden;
            position: relative;
        }
        .marquee-wrapper {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }
        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            animation: none;
            will-change: transform;
        }
        /* Only apply marquee animation if text overflows AND data-marquee-active="true" */
        .marquee-wrapper[data-marquee-active="true"] .marquee-content {
            animation: smoothMarquee 12s linear infinite;
        }
        .marquee-wrapper[data-marquee-active="true"]:hover .marquee-content {
            animation-play-state: paused;
        }
        @keyframes smoothMarquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .mini-player-title {
            font-size: 0.82rem; font-weight: 700;
            color: var(--text-base);
            display: inline-block;
        }
        .mini-player-artist {
            font-size: 0.72rem; color: var(--text-subdued);
            display: inline-block;
            margin-left: 6px;
        }
        .mini-player-artist::before {
            content: "•";
            margin-right: 6px;
            color: var(--text-subdued);
        }
        /* Controls area: fixed dimensions, never shifts */
        .mini-player-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            margin-left: 4px;
        }
        .mini-btn {
            width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        .mini-btn:hover { background: rgba(255,255,255,0.08); }
        .mini-btn-play { background: #fff; color: #000; }
        .mini-btn-play:hover { background: #e5e5ea; transform: scale(1.03); }
        .mini-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .mini-progress { position: absolute; bottom: 0; left: 14px; right: 14px; height: 2px; background: rgba(255,255,255,0.06); border-radius: 100px; overflow: hidden; }
        .mini-progress-fill { height: 100%; background: #ffffff; width: 0%; transition: width 0.15s linear; }

        /* FULLSCREEN PLAYER - SUPERIOR FIXED LAYOUT */
        .fullscreen-player {
            position: fixed; inset: 0; z-index: 1000; display: none; flex-direction: column; overflow: hidden;
            background: #000000; opacity: 0; transform: scale(1.02); transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
            height: 100vh; height: 100dvh;
        }
        .fullscreen-player.active { display: flex; opacity: 1; transform: scale(1); }
        .fullscreen-bg { position: absolute; inset: -10%; z-index: -2; background: #000000; filter: blur(80px); transform: scale(1.1); }
        .fs-content-wrap {
            flex: 1; display: flex; flex-direction: column; padding: 24px 24px calc(20px + env(safe-area-inset-bottom));
            max-width: 520px; margin: 0 auto; width: 100%; position: relative; z-index: 10;
            justify-content: space-between; overflow: hidden;
        }
        .fs-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-shrink: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 14px; }
        .fs-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2.5px; color: var(--text-subdued); font-weight: 800; }
        .fs-album-wrap { width: 82vw; height: 82vw; max-width: 340px; max-height: 340px; margin: 0 auto; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5); flex-shrink: 0; }
        .fs-album-art { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* FIXED LAYOUT: Title & Artist in fixed-width marquee containers */
        .fs-info-section {
            flex: 0 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .fs-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }
        .fs-text-group {
            flex: 1;
            min-width: 0; /* crucial to contain overflow */
            overflow: hidden;
        }
        .fs-marquee-title {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }
        .fs-marquee-title .marquee-content {
            display: inline-block;
            white-space: nowrap;
        }
        .fs-marquee-title[data-marquee-active="true"] .marquee-content {
            animation: smoothMarquee 14s linear infinite;
        }
        .fs-marquee-title[data-marquee-active="true"]:hover .marquee-content {
            animation-play-state: paused;
        }
        .fs-title {
            font-size: 1.45rem; font-weight: 800; letter-spacing: -0.03em;
            display: inline-block;
        }
        .fs-marquee-artist {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-top: 6px;
        }
        .fs-marquee-artist[data-marquee-active="true"] .marquee-content {
            animation: smoothMarquee 12s linear infinite;
        }
        .fs-marquee-artist[data-marquee-active="true"]:hover .marquee-content {
            animation-play-state: paused;
        }
        .fs-artist {
            font-size: 0.95rem; color: var(--text-subdued); font-weight: 500;
            display: inline-block;
        }
        /* Action buttons: fixed size & position, never affected by text length */
        .fs-action-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .fs-ctrl-btn {
            width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        .fs-ctrl-btn:hover { background: rgba(255,255,255,0.06); }
        .fs-ctrl-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .fs-play-btn { width: 68px !important; height: 68px !important; background: #ffffff !important; color: #000000 !important; }
        
        .fs-progress-container { width: 100%; padding: 8px 0; cursor: pointer; flex-shrink: 0; }
        .fs-progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.15); border-radius: 100px; position: relative; }
        .fs-progress-fill { height: 100%; background: #ffffff; border-radius: 100px; width: 0%; }
        .fs-time { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-subdued); margin-top: 6px; }
        
        .fs-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0 16px;
            flex-shrink: 0;
        }
        .fs-options-panel {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 10px;
            flex-shrink: 0;
        }
        .fs-opt-btn { font-size: 0.72rem; color: var(--text-subdued); display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; }
        
        @media (min-width: 769px) {
            .fs-content-wrap { max-width: 1000px !important; padding: 40px 32px !important; }
            .fs-main { flex-direction: row !important; align-items: center !important; justify-content: space-between !important; gap: 54px !important; }
            .fs-album-wrap { max-width: 440px !important; width: 440px !important; height: 440px !important; }
            .fs-title { font-size: 1.9rem; }
            .fs-artist { font-size: 1.15rem; }
        }
        @media (max-width: 768px) {
            .fs-title { font-size: 1.2rem; }
            .fs-artist { font-size: 0.85rem; }
            .fs-ctrl-btn { width: 38px; height: 38px; }
            .fs-play-btn { width: 56px !important; height: 56px !important; }
        }
        .queue-panel, .sleep-dropdown { display: none; }
        .queue-panel.show { display: flex; flex-direction: column; position: absolute; inset: 0; background: rgba(10,10,12,0.98); backdrop-filter: blur(30px); z-index: 110; padding: 24px; }
        .sleep-dropdown.active { display: flex; position: absolute; bottom: 50px; right: 0; background: var(--glass-bg-strong); border-radius: 14px; flex-direction: column;}
        .toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); background: var(--glass-bg-strong); backdrop-filter: blur(24px); border-radius: 100px; padding: 10px 20px; opacity: 0; transition: 0.4s; z-index: 4000; pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        #youtube-player { position: absolute; top: -9999px; left: -9999px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass-bg-strong); backdrop-filter: blur(40px); border-top: 1px solid var(--glass-border); padding: 8px 16px; display: flex; justify-content: space-around; }
        .nav-btn { flex: 1; padding: 6px 0; display: flex; flex-direction: column; align-items: center; font-size: 0.65rem; color: var(--text-subdued); }
        .nav-btn.active { color: #ffffff; }
        .nav-indicator-slab { display: none; }
        .track-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; padding: 16px; }
        .track-card { background: var(--bg-card); border-radius: 18px; padding: 12px; cursor: pointer; }
        .featured-row, .kl-grid { display: flex; gap: 16px; overflow-x: auto; padding: 16px; }
        .featured-card { flex-shrink: 0; width: 200px; border-radius: 20px; overflow: hidden; background: #111; }
        .mood-chips-row { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; }
        .mood-chip { background: #1c1c1e; padding: 8px 18px; border-radius: 22px; font-size: 0.82rem; cursor: pointer; }
        .mood-chip.active { background: #fff; color: #000; }
    </style>
</head>
<body>

<div class="signin-overlay" id="signinOverlay" style="position:fixed; inset:0; background:#000; z-index:3000; display:flex; align-items:center; justify-content:center;">
    <div class="signin-card" style="background:#0a0a0c; border-radius:28px; padding:44px 32px; max-width:400px; text-align:center;">
        <h2 style="color:#fff;">Swar Music</h2>
        <input type="text" id="nameInput" placeholder="Enter your name" class="input-field" style="width:100%; padding:12px; margin:16px 0; background:rgba(255,255,255,0.05); border-radius:14px; color:#fff;">
        <button class="btn-primary" onclick="signIn()" style="background:#fff; color:#000; padding:12px; width:100%; border-radius:14px;">Get Started</button>
        <a class="skip-link" onclick="skipSignIn()" style="display:block; margin-top:12px; color:#8e8e93; cursor:pointer;">Continue as Guest</a>
    </div>
</div>

<div class="app" id="app">
    <header class="header">
        <div class="brand" onclick="goHome()"><div class="brand-icon"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='black'%3E%3Cpath d='M12 3L2 9l10 6 10-6-10-6z M2 15l10 6 10-6'/%3E%3C/svg%3E"></div><span class="brand-name">swar</span></div>
        <div class="search-wrap"><svg class="search-icon-svg" viewBox="0 0 24 24"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 101.414-1.414l-4.344-4.344a9.157 9.157 0 002.077-5.816c0-5.14-4.226-9.28-9.407-9.28z"/></svg><input type="text" id="searchInput" placeholder="Search tracks or paste link..."></div>
        <div class="user-avatar" id="userAvatar" onclick="toggleUserMenu(event)">U</div>
    </header>
    <div id="homeView"><div class="home-greeting"><div><div class="home-greeting-text" id="greeting">good evening</div></div></div><div class="mood-chips-row" id="moodChipsRow"></div><div class="featured-section"><div class="featured-row" id="featuredRow"></div></div><div class="kl-section"><div class="kl-header">Keep listening</div><div class="kl-grid" id="klGrid"></div></div></div>
    <div id="otherView" style="display:none;"><div class="section-header"><h2 class="section-title" id="sectionTitle">recently played</h2></div><div id="contentArea"></div></div>
</div>

<div class="mini-player" id="miniPlayer">
    <img class="mini-player-img" id="miniPlayerImg">
    <div class="mini-player-info">
        <div class="marquee-wrapper" id="miniMarqueeWrapper" data-marquee-active="false">
            <div class="marquee-content">
                <span class="mini-player-title" id="miniPlayerTitle">Not Playing</span>
                <span class="mini-player-artist" id="miniPlayerArtist">—</span>
            </div>
        </div>
    </div>
    <div class="mini-player-controls">
        <button class="mini-btn" onclick="prevTrack()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="mini-btn mini-btn-play" id="miniPlayBtn" onclick="togglePlay()"><svg id="miniPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="mini-btn" onclick="nextTrack()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
    <div class="mini-progress"><div class="mini-progress-fill" id="miniProgress"></div></div>
</div>

<nav class="bottom-nav"><button class="nav-btn active" onclick="navigateTo('home')">Home</button><button class="nav-btn" onclick="navigateTo('search')">Search</button><button class="nav-btn" onclick="navigateTo('library')">Library</button></nav>

<div class="fullscreen-player" id="fullscreenPlayer">
    <div class="fullscreen-bg"></div>
    <div class="fs-content-wrap">
        <div class="fs-top"><div class="fs-top-info"><span class="fs-label">NOW PLAYING</span></div></div>
        <div class="fs-main"><div class="fs-album-wrap"><img class="fs-album-art" id="fsAlbumArt"></div>
        <div class="fs-info-section">
            <div class="fs-title-row">
                <div class="fs-text-group">
                    <div class="fs-marquee-title" id="fsTitleMarquee" data-marquee-active="false"><div class="marquee-content"><h1 class="fs-title" id="fsTitle">Not Playing</h1></div></div>
                    <div class="fs-marquee-artist" id="fsArtistMarquee" data-marquee-active="false"><div class="marquee-content"><p class="fs-artist" id="fsArtist">—</p></div></div>
                </div>
                <div class="fs-action-buttons"><button class="fs-ctrl-btn" id="likeBtn" onclick="toggleLike()"><svg id="likeIcon" viewBox="0 0 24 24" width="22" height="22"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div>
            </div>
            <div class="fs-progress-container" id="fsProgressContainer"><div class="fs-progress-bar"><div class="fs-progress-fill" id="fsProgress"></div></div><div class="fs-time"><span id="fsCurrentTime">0:00</span><span id="fsDuration">0:00</span></div></div>
            <div class="fs-controls"><button class="fs-ctrl-btn" onclick="prevTrack()"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button><button class="fs-ctrl-btn fs-play-btn" onclick="togglePlay()"><svg id="fsPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><button class="fs-ctrl-btn" onclick="nextTrack()"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button></div>
            <div class="fs-options-panel"><button class="fs-opt-btn" onclick="shareTrack()">Share</button></div>
            <div class="swipe-down-hint" style="text-align:center; font-size:0.7rem;"><span>Swipe down to close</span></div>
        </div></div>
    </div>
</div>
<div class="toast" id="toast"></div>
<div id="youtube-player"></div>

<script>
    // simplified production player with permanent text marquee & fixed controls
    let player, isPlaying=false, ready=false, currentTrackIndex=0, tracks=[], progressInterval=null, isShuffleOn=false, repeatMode=0;
    let user=null, likedTracks=new Map();
    const PIPED_INSTANCES = ['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de'];
    const BACKUP = [{id:'2Vv-BfVoq4g',title:'Perfect (Very Long Title That Should Scroll Smoothly Without Breaking Layout)',artist:'Ed Sheeran',duration:279},{id:'fKopy74weus',title:'Starboy',artist:'The Weeknd',duration:230},{id:'3AtDnEC4zak',title:'Attention',artist:'Charlie Puth',duration:210}];
    function $(id){return document.getElementById(id);}
    function formatDuration(s){let m=Math.floor(s/60),sec=Math.floor(s%60); return `${m}:${sec<10?'0'+sec:sec}`;}
    function getThumb(id){return `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;}
    function showToast(msg){let t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000);}
    function updateMarqueeStatus(element, text) { if(!element) return; const wrapper = element; const contentSpan = wrapper.querySelector('.marquee-content'); if(contentSpan && contentSpan.scrollWidth > wrapper.clientWidth) wrapper.setAttribute('data-marquee-active','true'); else wrapper.setAttribute('data-marquee-active','false'); }
    function updateTextAndMarquee() { const t=tracks[currentTrackIndex]||{title:'-',artist:'-'}; $('miniPlayerTitle').innerText=t.title; $('miniPlayerArtist').innerText=t.artist; $('fsTitle').innerText=t.title; $('fsArtist').innerText=t.artist; updateMarqueeStatus($('miniMarqueeWrapper'), t.title+t.artist); updateMarqueeStatus($('fsTitleMarquee'), t.title); updateMarqueeStatus($('fsArtistMarquee'), t.artist); }
    function playTrack(i){ if(!ready||!tracks[i]) return; currentTrackIndex=i; const t=tracks[i]; player.loadVideoById(t.id); player.playVideo(); $('miniPlayerImg').src=getThumb(t.id); $('fsAlbumArt').src=getThumb(t.id); updateTextAndMarquee(); updateLikeButton(); }
    function togglePlay(){ if(!ready) return; if(isPlaying) player.pauseVideo(); else player.playVideo(); }
    function nextTrack(){ if(tracks.length===0) return; if(isShuffleOn && tracks.length>1){ let n; do{n=Math.floor(Math.random()*tracks.length);}while(n===currentTrackIndex); currentTrackIndex=n; }else currentTrackIndex=(currentTrackIndex+1)%tracks.length; playTrack(currentTrackIndex); }
    function prevTrack(){ if(tracks.length===0) return; if(player.getCurrentTime()>3) player.seekTo(0); else currentTrackIndex=(currentTrackIndex-1+tracks.length)%tracks.length; playTrack(currentTrackIndex); }
    function startProgress(){ clearInterval(progressInterval); progressInterval=setInterval(()=>{ if(isPlaying && player && player.getCurrentTime){ let c=player.getCurrentTime(), d=player.getDuration()||tracks[currentTrackIndex]?.duration||0; let pct=(c/d)*100; $('miniProgress').style.width=pct+'%'; $('fsProgress').style.width=pct+'%'; $('fsCurrentTime').innerText=formatDuration(c); $('fsDuration').innerText=formatDuration(d); } },300); }
    function onPlayerReady(e){ ready=true; player.setVolume(85); $('miniPlayer').classList.add('visible'); if(tracks.length) playTrack(0); }
    function onPlayerStateChange(e){ if(e.data===YT.PlayerState.PLAYING){ isPlaying=true; $('miniPlayIcon').innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; $('fsPlayIcon').innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; startProgress(); } else if(e.data===YT.PlayerState.PAUSED){ isPlaying=false; $('miniPlayIcon').innerHTML='<path d="M8 5v14l11-7z"/>'; $('fsPlayIcon').innerHTML='<path d="M8 5v14l11-7z"/>'; clearInterval(progressInterval); } else if(e.data===YT.PlayerState.ENDED){ if(repeatMode===2) player.seekTo(0); else nextTrack();} }
    function initYT(){ if(window.YT) createPlayer(); else { window.onYouTubeIframeAPIReady=createPlayer; let s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); } }
    function createPlayer(){ player=new YT.Player('youtube-player',{events:{onReady:onPlayerReady,onStateChange:onPlayerStateChange,onError:()=>{ showToast('stream error'); nextTrack(); }}}); }
    function signIn(){ let name=$('nameInput').value.trim(); if(!name) return; user={name}; Storage.set('swar_user',user); $('signinOverlay').style.display='none'; updateUserUI(); }
    function skipSignIn(){ user={name:'Guest'}; $('signinOverlay').style.display='none'; updateUserUI(); }
    function updateUserUI(){ if(user) $('userAvatar').innerText=user.name[0].toUpperCase(); }
    function toggleLike(){ let t=tracks[currentTrackIndex]; if(!t) return; if(likedTracks.has(t.id)) likedTracks.delete(t.id); else likedTracks.set(t.id,t); Storage.set('swar_liked',Array.from(likedTracks.values())); updateLikeButton(); }
    function updateLikeButton(){ let t=tracks[currentTrackIndex]; if(t&&likedTracks.has(t.id)) $('likeIcon').innerHTML='<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ffffff"/>'; else $('likeIcon').innerHTML='<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="#ffffff" stroke-width="2"/>';}
    function openFullscreen(){ $('fullscreenPlayer').classList.add('active'); $('app').classList.add('fs-open'); document.body.style.overflow='hidden'; }
    function closeFullscreen(){ $('fullscreenPlayer').classList.remove('active'); $('app').classList.remove('fs-open'); document.body.style.overflow=''; }
    function shareTrack(){ let t=tracks[currentTrackIndex]; if(t&&navigator.share) navigator.share({title:t.title}); else if(t) navigator.clipboard.writeText(`https://youtube.com/watch?v=${t.id}`).then(()=>showToast('Link copied')); }
    function navigateTo(view){ if(view==='home'){$('homeView').style.display='block'; $('otherView').style.display='none';}else{$('homeView').style.display='none';$('otherView').style.display='block'; if(view==='library') { let arr=Array.from(likedTracks.values()); tracks=arr.length?arr:BACKUP; renderTrackGrid();} else{$('contentArea').innerHTML='<div style="padding:40px; text-align:center;">🔍 Search above</div>';}}}
    function goHome(){ navigateTo('home');}
    function renderTrackGrid(){ let html=tracks.map((t,i)=>`<div class="track-card" onclick="playTrack(${i})"><img src="${getThumb(t.id)}" style="width:100%; border-radius:12px;"><h4>${escapeHtml(t.title)}</h4><p>${escapeHtml(t.artist)}</p></div>`).join(''); $('contentArea').innerHTML=`<div class="track-grid">${html}</div>`;}
    function escapeHtml(s){return s.replace(/[&<>]/g,function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;});}
    async function loadHomeTracks(){ tracks=BACKUP; renderFeatured(); renderKL(); }
    function renderFeatured(){ let html=BACKUP.map(t=>`<div class="featured-card" onclick="playTrack(${BACKUP.indexOf(t)})"><img src="${getThumb(t.id)}" style="width:100%; height:150px; object-fit:cover;"><div style="padding:8px"><b>${t.title}</b></div></div>`).join(''); $('featuredRow').innerHTML=html; }
    function renderKL(){ let html=BACKUP.map(t=>`<div class="kl-card" onclick="playTrack(${BACKUP.indexOf(t)})"><img src="${getThumb(t.id)}" style="width:100px; border-radius:12px;"><div>${t.title}</div></div>`).join(''); $('klGrid').innerHTML=html; }
    function toggleUserMenu(e){ e.stopPropagation();}
    $('miniPlayer').addEventListener('click',openFullscreen);
    $('fullscreenPlayer').addEventListener('touchstart',(e)=>{if(e.target.closest('.fs-content-wrap')&&e.touches[0].clientY>window.innerHeight-100) closeFullscreen();});
    window.addEventListener('resize',()=>{ updateMarqueeStatus($('miniMarqueeWrapper'),''); updateMarqueeStatus($('fsTitleMarquee'),''); updateMarqueeStatus($('fsArtistMarquee'),''); });
    const Storage={get(k){try{let v=localStorage.getItem(k); return v?JSON.parse(v):null;}catch{return null;}},set(k,v){localStorage.setItem(k,JSON.stringify(v));}};
    (function init(){ let savedUser=Storage.get('swar_user'); if(savedUser){user=savedUser;$('signinOverlay').style.display='none';updateUserUI();} let saved=Storage.get('swar_liked')||[]; likedTracks=new Map(saved.map(t=>[t.id,t])); loadHomeTracks(); initYT(); })();
</script>
</body>
