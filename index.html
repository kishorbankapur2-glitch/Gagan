<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Panel</title>
    <style>
        /* Removes all gaps and makes the panel full-screen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000; /* Black background for video */
        }

        .panel-wrapper {
            width: 100%;
            height: 100vh;
            display: flex;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="panel-wrapper">
        <iframe 
            src="https://outball.pages.dev/ENG" 
            title="Video Content"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts allow-top-navigation"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
