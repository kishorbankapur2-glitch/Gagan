<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Swar | Dynamic Audio Universe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-base: #0B0B0E;
            --bg-elevated: #131318;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);
            --text: #ffffff;
            --text-secondary: #A1A1AA;
            --accent: #ffffff;
            --accent-soft: rgba(255, 255, 255, 0.2);
            --player-glow: 0px 0px 20px rgba(255, 255, 255, 0.1);
            --ease-spring: cubic-bezier(0.25, 1, 0.5, 1);
        }

        body {
            background: var(--bg-base);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        /* Album Art Color Extraction Dynamic Background */
        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 20%, rgba(0,0,0,0.6), #000);
            transition: background 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: -2;
            pointer-events: none;
        }

        .blur-bg {
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            filter: blur(80px);
            opacity: 0.25;
            z-index: -1;
            transition: all 0.6s ease;
            pointer-events: none;
        }

        /* App Layout */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px 100px 24px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0 32px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            background: rgba(11, 11, 14, 0.7);
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 20px;
        }

        .icon-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s var(--ease-spring);
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn:hover {
            background: var(--surface-hover);
            transform: translateY(-2px);
            border-color: var(--border-strong);
        }

        /* Stats Panel */
        .stats-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 20px 24px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            backdrop-filter: blur(12px);
        }

        .stat-card {
            flex: 1;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Featured & Grids */
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 32px 0 20px 0;
            letter-spacing: -0.02em;
        }

        .track-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .track-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s var(--ease-spring);
        }

        .track-card:hover {
            transform: translateY(-6px);
            background: var(--surface-hover);
            border-color: var(--border-strong);
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
        }

        .track-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .track-title {
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Speed & Crossfade Row */
        .control-row {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            padding: 6px 16px;
            border-radius: 40px;
        }

        .speed-value {
            font-weight: 800;
            min-width: 45px;
            text-align: center;
        }

        .toggle-switch {
            width: 44px;
            height: 24px;
            background: #2c2c2e;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            padding: 2px;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-knob {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .toggle-switch.active {
            background: white;
        }
        .toggle-switch.active .toggle-knob {
            transform: translateX(20px);
            background: black;
        }

        /* Mini Player (Bottom) */
        .mini-player {
            position: fixed;
            bottom: 24px;
            left: 24px;
            right: 24px;
            background: rgba(20, 20, 26, 0.95);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-strong);
            border-radius: 60px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 200;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
            transition: transform 0.3s var(--ease-spring);
        }

        .mini-art {
            width: 48px;
            height: 48px;
            border-radius: 30px;
            object-fit: cover;
        }

        .mini-info {
            flex: 1;
        }

        .mini-title {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .mini-artist {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .mini-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        /* Fullscreen Visualizer Overlay */
        .visualizer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(40px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .visualizer-canvas {
            width: 90%;
            max-width: 800px;
            height: 300px;
            border-radius: 40px;
        }

        .close-viz {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 1.5rem;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
        }

        /* Share Card Canvas */
        .share-card-canvas {
            position: fixed;
            top: -9999px;
            left: -9999px;
        }

        /* Mood Badge */
        .mood-badge {
            background: rgba(255,255,255,0.05);
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* Keyboard Shortcuts Hint */
        .kbd-hint {
            position: fixed;
            bottom: 100px;
            right: 24px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-family: monospace;
            border: 1px solid var(--border);
            z-index: 300;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(0.98);}
            100% { opacity: 1; transform: scale(1);}
        }
    </style>
</head>
<body>
<div class="dynamic-bg" id="dynamicBg"></div>
<div class="blur-bg" id="blurBg"></div>

<div class="app-container">
    <div class="header">
        <div class="logo">⚡ SWAR · AUDIO</div>
        <div class="header-actions">
            <button class="icon-btn" id="statsBtn">📊 Listening Stats</button>
            <button class="icon-btn" id="vizBtn">🎵 Visualizer</button>
            <button class="icon-btn" id="shareBtn">🖼️ Share Card</button>
        </div>
    </div>

    <!-- Stats Dashboard -->
    <div id="statsPanel" class="stats-panel" style="display: none;">
        <div class="stat-card"><div class="stat-value" id="totalPlays">0</div><div class="stat-label">Total Plays</div></div>
        <div class="stat-card"><div class="stat-value" id="uniqueTracks">0</div><div class="stat-label">Unique Tracks</div></div>
        <div class="stat-card"><div class="stat-value" id="listeningTime">0h</div><div class="stat-label">Listening Time</div></div>
        <div class="stat-card"><div class="stat-value" id="favoritesCount">0</div><div class="stat-label">Favorites</div></div>
    </div>

    <!-- Speed & Crossfade -->
    <div class="control-row">
        <div class="speed-control">
            <span>⚡ Speed</span>
            <button id="speedDown" class="icon-btn" style="padding:4px 12px;">−</button>
            <span id="speedValue" class="speed-value">1.0x</span>
            <button id="speedUp" class="icon-btn" style="padding:4px 12px;">+</button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <span>🔊 Crossfade</span>
            <div id="crossfadeToggle" class="toggle-switch"><div class="toggle-knob"></div></div>
        </div>
        <div class="mood-badge" id="moodTag">🌙 Evening Vibes</div>
    </div>

    <!-- Recently Played Timeline -->
    <div>
        <h2 class="section-title">📜 Recently Played Timeline</h2>
        <div id="recentTimeline" style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 16px;"></div>
    </div>

    <!-- Main Track Library (Custom Playlists from localStorage) -->
    <div>
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <h2 class="section-title">🎧 Core Collection</h2>
            <button id="createPlaylistBtn" class="icon-btn">+ New Playlist (local)</button>
        </div>
        <div id="trackList" class="track-grid"></div>
    </div>
</div>

<!-- Mini Player -->
<div id="miniPlayer" class="mini-player" style="transform: translateY(120px); opacity: 0;">
    <img id="miniArt" class="mini-art" src="https://picsum.photos/48/48">
    <div class="mini-info">
        <div id="miniTitle" class="mini-title">Select a track</div>
        <div id="miniArtist" class="mini-artist">Swar</div>
    </div>
    <div class="mini-controls">
        <button id="miniPrev" class="ctrl-btn">⏮</button>
        <button id="miniPlayPause" class="ctrl-btn" style="background:white; color:black;">▶</button>
        <button id="miniNext" class="ctrl-btn">⏭</button>
    </div>
</div>

<!-- Fullscreen Visualizer -->
<div id="visualizerOverlay" class="visualizer-overlay">
    <button class="close-viz" id="closeVizBtn">✕ CLOSE</button>
    <canvas id="vizCanvas" class="visualizer-canvas" width="800" height="300"></canvas>
    <div style="color:white; text-align:center;">✨ Animated Audio Visualizer ✨</div>
</div>

<canvas id="shareCanvas" class="share-card-canvas" width="500" height="500"></canvas>
<div class="kbd-hint">⌨️ SPACE: Play/Pause | ← → : Prev/Next</div>

<script>
    // ------------------------------
    // 1. Data & State
    // ------------------------------
    let currentTrackIndex = 0;
    let isPlaying = false;
    let currentSpeed = 1.0;
    let crossfadeEnabled = false;
    let audioElement = null;
    let audioCtx = null;
    let sourceNode = null;
    let gainNode = null;
    let analyser = null;
    let animationId = null;
    let isVisualizerActive = false;

    // Storage Keys
    const STORAGE_PLAYLISTS = 'swar_custom_playlists';
    const STORAGE_RECENT = 'swar_recent_tracks';
    const STORAGE_FAVORITES = 'swar_favorites';
    const STORAGE_STATS = 'swar_stats';

    // Core library (default)
    let masterLibrary = [
        { id: '1', title: 'Midnight Dreams', artist: 'Aurora Waves', cover: 'https://picsum.photos/id/104/200/200', duration: 210 },
        { id: '2', title: 'Electric Horizon', artist: 'Neon Pulse', cover: 'https://picsum.photos/id/106/200/200', duration: 185 },
        { id: '3', title: 'Silent Echoes', artist: 'Luna Ray', cover: 'https://picsum.photos/id/107/200/200', duration: 245 },
        { id: '4', title: 'Velocity', artist: 'Crystal Method', cover: 'https://picsum.photos/id/155/200/200', duration: 198 },
        { id: '5', title: 'Celestial', artist: 'Orbit', cover: 'https://picsum.photos/id/29/200/200', duration: 232 }
    ];
    
    let customPlaylists = []; // each: { name, tracks: [] }
    let recentTracks = [];
    let favorites = new Set();
    let stats = { totalPlays: 0, totalTimeSec: 0 };

    function loadStorage() {
        const savedPlaylists = localStorage.getItem(STORAGE_PLAYLISTS);
        if(savedPlaylists) customPlaylists = JSON.parse(savedPlaylists);
        const savedRecent = localStorage.getItem(STORAGE_RECENT);
        if(savedRecent) recentTracks = JSON.parse(savedRecent);
        const savedFavs = localStorage.getItem(STORAGE_FAVORITES);
        if(savedFavs) favorites = new Set(JSON.parse(savedFavs));
        const savedStats = localStorage.getItem(STORAGE_STATS);
        if(savedStats) stats = JSON.parse(savedStats);
        updateStatsUI();
    }

    function saveData() {
        localStorage.setItem(STORAGE_PLAYLISTS, JSON.stringify(customPlaylists));
        localStorage.setItem(STORAGE_RECENT, JSON.stringify(recentTracks));
        localStorage.setItem(STORAGE_FAVORITES, JSON.stringify([...favorites]));
        localStorage.setItem(STORAGE_STATS, JSON.stringify(stats));
    }

    // ------------------------------
    // 2. Color Extraction from Album Art (Dynamic Background)
    // ------------------------------
    async function extractColorsFromImage(url) {
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = url;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 50;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 50, 50);
                const pixels = ctx.getImageData(0, 0, 50, 50).data;
                let r = 0, g = 0, b = 0;
                for (let i = 0; i < pixels.length; i+=4) {
                    r += pixels[i];
                    g += pixels[i+1];
                    b += pixels[i+2];
                }
                const total = pixels.length/4;
                r = Math.floor(r/total);
                g = Math.floor(g/total);
                b = Math.floor(b/total);
                resolve(`radial-gradient(circle at 30% 20%, rgba(${r},${g},${b},0.4), #000000dd), linear-gradient(135deg, rgba(0,0,0,0.7), #020202)`);
            };
            img.onerror = () => resolve(`radial-gradient(circle at 30% 20%, rgba(30,30,40,0.5), #000000dd)`);
        });
    }

    async function updateDynamicBackground(track) {
        const bgDiv = document.getElementById('dynamicBg');
        const blurDiv = document.getElementById('blurBg');
        let coverUrl = track.cover;
        if(!coverUrl) coverUrl = 'https://picsum.photos/id/104/200/200';
        const gradient = await extractColorsFromImage(coverUrl);
        bgDiv.style.background = gradient;
        blurDiv.style.backgroundImage = `url(${coverUrl})`;
        blurDiv.style.backgroundSize = 'cover';
        blurDiv.style.backgroundPosition = 'center';
    }

    // ------------------------------
    // 3. Audio Engine with Speed & Crossfade (simulated)
    // ------------------------------
    function initAudio() {
        if(audioElement) {
            audioElement.pause();
            audioElement = null;
        }
        audioElement = new Audio();
        audioElement.preload = 'auto';
        audioElement.crossOrigin = 'anonymous';
        audioElement.onended = () => { nextTrack(); };
        audioElement.onplay = () => { isPlaying = true; updatePlayPauseUI(); startVizIfNeeded(); };
        audioElement.onpause = () => { isPlaying = false; updatePlayPauseUI(); };
        audioElement.ontimeupdate = () => { if(isVisualizerActive) drawVisualizer(); };
    }

    function setSpeed(speed) {
        currentSpeed = Math.min(2.0, Math.max(0.5, speed));
        document.getElementById('speedValue').innerText = currentSpeed.toFixed(1) + 'x';
        if(audioElement) audioElement.playbackRate = currentSpeed;
    }

    function playTrack(index) {
        const allTracks = getAllTracksFlat();
        if(!allTracks.length) return;
        const track = allTracks[index];
        currentTrackIndex = index;
        if(audioElement) audioElement.pause();
        initAudio();
        // Simulate audio stream (using a synth beep? but we use silent mp3? Let's use a real audio sample from dummy but we use web audio Osc? For simplicity, we use a fake streaming URL - but actual working: use a placeholder audio. Better: generate oscillator? No, better use an online mp3 example? For demo, we use a silent loop? Actually we use a generic MP3 from test server? but to avoid CORS, I'll use Web Audio API OSCILLATOR based on track? But easier: create an AudioContext with oscillator? but playback controls? We'll use a real sample: freesound? Not safe. I'll use a synthetic sine wave generator? Better: use Web Audio API to generate sound dynamically, but user expects music playback. To make it fully functional, I'll use a dummy Audio element from an open source test MP3? Use a sample from GitHub? Safer: use 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'? That's allowed. But need multiple tracks? I'll map dummy track IDs to different MP3, but all same. For UX, each track plays same demo but shows metadata. I'll use a single demo MP3 with speed control.
        const demoAudio = 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
        audioElement.src = demoAudio;
        audioElement.playbackRate = currentSpeed;
        audioElement.play().catch(e=>console.warn);
        updateMiniUI(track);
        updateDynamicBackground(track);
        addToRecent(track);
        updateStatsPlay(track);
        renderTrackGrid();
        renderTimeline();
    }

    function getAllTracksFlat() {
        let all = [...masterLibrary];
        for(let pl of customPlaylists) all.push(...pl.tracks);
        return all;
    }

    function updateMiniUI(track) {
        document.getElementById('miniArt').src = track.cover;
        document.getElementById('miniTitle').innerText = track.title;
        document.getElementById('miniArtist').innerText = track.artist;
        document.getElementById('miniPlayer').style.transform = 'translateY(0)';
        document.getElementById('miniPlayer').style.opacity = '1';
    }

    function togglePlay() {
        if(!audioElement) return;
        if(isPlaying) audioElement.pause();
        else audioElement.play();
    }

    function nextTrack() {
        const all = getAllTracksFlat();
        if(all.length === 0) return;
        let next = (currentTrackIndex + 1) % all.length;
        playTrack(next);
    }
    function prevTrack() {
        const all = getAllTracksFlat();
        let prev = (currentTrackIndex - 1 + all.length) % all.length;
        playTrack(prev);
    }

    function updatePlayPauseUI() {
        const btn = document.getElementById('miniPlayPause');
        if(isPlaying) btn.innerHTML = '⏸';
        else btn.innerHTML = '▶';
    }

    // Crossfade simulation: when enabled, crossfade adds small transition (just UI)
    let crossfadeTimeout = null;
    function enableCrossfade(val) {
        crossfadeEnabled = val;
        const toggleDiv = document.getElementById('crossfadeToggle');
        if(val) toggleDiv.classList.add('active');
        else toggleDiv.classList.remove('active');
    }

    // ------------------------------
    // 4. Listening Stats & UI
    // ------------------------------
    function updateStatsPlay(track) {
        stats.totalPlays += 1;
        stats.totalTimeSec += track.duration;
        saveData();
        updateStatsUI();
    }
    function updateStatsUI() {
        document.getElementById('totalPlays').innerText = stats.totalPlays;
        const unique = getAllTracksFlat().length;
        document.getElementById('uniqueTracks').innerText = unique;
        const hours = Math.floor(stats.totalTimeSec / 3600);
        document.getElementById('listeningTime').innerText = hours + 'h';
        document.getElementById('favoritesCount').innerText = favorites.size;
    }

    // ------------------------------
    // 5. Recently Played Timeline
    // ------------------------------
    function addToRecent(track) {
        recentTracks = recentTracks.filter(t => t.id !== track.id);
        recentTracks.unshift(track);
        if(recentTracks.length > 10) recentTracks.pop();
        localStorage.setItem(STORAGE_RECENT, JSON.stringify(recentTracks));
        renderTimeline();
    }

    function renderTimeline() {
        const container = document.getElementById('recentTimeline');
        if(!container) return;
        container.innerHTML = recentTracks.map(t => `
            <div style="background: var(--surface); border-radius: 16px; padding: 8px; min-width: 100px; text-align: center; cursor:pointer;" onclick="playTrackById('${t.id}')">
                <img src="${t.cover}" style="width: 70px; height:70px; border-radius: 12px; object-fit:cover;">
                <div style="font-size:0.7rem; margin-top:6px;">${t.title.substring(0,12)}</div>
            </div>
        `).join('');
    }
    window.playTrackById = (id) => {
        const all = getAllTracksFlat();
        const idx = all.findIndex(t => t.id === id);
        if(idx !== -1) playTrack(idx);
    };

    // ------------------------------
    // 6. Custom Playlists (localStorage)
    // ------------------------------
    function createPlaylist() {
        let name = prompt('Playlist name:');
        if(!name) return;
        customPlaylists.push({ name, tracks: [] });
        saveData();
        renderTrackGrid();
    }
    function addToPlaylist(track) {
        if(customPlaylists.length === 0) { alert('No playlist, create one first.'); return; }
        let plNames = customPlaylists.map((p,idx)=>`${idx+1}. ${p.name}`).join('\n');
        let choice = prompt(`Add to playlist:\n${plNames}\nEnter number:`);
        let idx = parseInt(choice) - 1;
        if(idx >=0 && idx < customPlaylists.length) {
            customPlaylists[idx].tracks.push(track);
            saveData();
            renderTrackGrid();
            alert(`Added to ${customPlaylists[idx].name}`);
        }
    }

    // ------------------------------
    // 7. Share Card (Canvas Image)
    // ------------------------------
    async function generateShareCard() {
        const all = getAllTracksFlat();
        if(!all.length) return;
        const track = all[currentTrackIndex] || all[0];
        const canvas = document.getElementById('shareCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 500; canvas.height = 500;
        ctx.fillStyle = '#111';
        ctx.fillRect(0,0,500,500);
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.src = track.cover;
        await new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
        ctx.drawImage(img, 40, 40, 200, 200);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 28px Inter';
        ctx.fillText(track.title, 40, 300);
        ctx.font = '18px Inter';
        ctx.fillStyle = '#aaa';
        ctx.fillText(track.artist, 40, 350);
        ctx.font = '14px monospace';
        ctx.fillStyle = '#666';
        ctx.fillText(`Swar • ${stats.totalPlays} total plays`, 40, 450);
        const link = document.createElement('a');
        link.download = 'swar_share.png';
        link.href = canvas.toDataURL();
        link.click();
    }

    // ------------------------------
    // 8. Animated Visualizer (fullscreen)
    // ------------------------------
    function startVisualizer() {
        if(!audioElement) return;
        if(!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            gainNode = audioCtx.createGain();
            const mediaSrc = audioCtx.createMediaElementSource(audioElement);
            mediaSrc.connect(gainNode);
            gainNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            gainNode.gain.value = 1;
        }
        isVisualizerActive = true;
        document.getElementById('visualizerOverlay').style.display = 'flex';
        drawVisualizer();
    }
    function drawVisualizer() {
        if(!isVisualizerActive || !analyser) return;
        const canvas = document.getElementById('vizCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width, height = canvas.height;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0, 0, width, height);
        const barWidth = (width / bufferLength) * 4;
        let x = 0;
        for(let i = 0; i < bufferLength; i+=2) {
            const value = dataArray[i];
            const percent = value / 255;
            const barHeight = percent * height * 0.7;
            ctx.fillStyle = `hsl(${180 + value * 0.5}, 80%, 60%)`;
            ctx.fillRect(x, height - barHeight, barWidth - 1, barHeight);
            x += barWidth;
        }
        animationId = requestAnimationFrame(drawVisualizer);
    }
    function stopVisualizer() {
        isVisualizerActive = false;
        if(animationId) cancelAnimationFrame(animationId);
        document.getElementById('visualizerOverlay').style.display = 'none';
    }
    function startVizIfNeeded() { if(isVisualizerActive) drawVisualizer(); }

    // ------------------------------
    // 9. Mood by Time of Day (auto vibe)
    // ------------------------------
    function updateMoodByTime() {
        const hour = new Date().getHours();
        let mood = '';
        if(hour < 12) mood = '🌅 Morning Energy';
        else if(hour < 17) mood = '☀️ Afternoon Groove';
        else if(hour < 21) mood = '🌆 Sunset Chill';
        else mood = '🌙 Midnight Focus';
        document.getElementById('moodTag').innerHTML = mood;
    }

    // ------------------------------
    // 10. Keyboard Shortcuts
    // ------------------------------
    function handleKey(e) {
        if(e.code === 'Space') { e.preventDefault(); togglePlay(); }
        else if(e.code === 'ArrowLeft') prevTrack();
        else if(e.code === 'ArrowRight') nextTrack();
        else if(e.code === 'KeyV') startVisualizer();
    }

    // ------------------------------
    // 11. Render Track Grid (including custom playlists)
    // ------------------------------
    function renderTrackGrid() {
        const container = document.getElementById('trackList');
        let all = getAllTracksFlat();
        let html = all.map((track, idx) => `
            <div class="track-card" onclick="playTrack(${idx})">
                <img class="track-img" src="${track.cover}" onerror="this.src='https://picsum.photos/id/104/200/200'">
                <div class="track-title">${track.title}</div>
                <div class="track-artist">${track.artist}</div>
                <div style="display:flex; gap:6px; margin-top:8px;">
                    <button class="icon-btn" style="padding:4px 10px; font-size:12px;" onclick="event.stopPropagation(); addToFav('${track.id}')">❤️</button>
                    <button class="icon-btn" style="padding:4px 10px; font-size:12px;" onclick="event.stopPropagation(); addToPlaylist(${JSON.stringify(track).replace(/"/g, '&quot;')})">➕ Playlist</button>
                </div>
            </div>
        `).join('');
        // show custom playlists groups
        if(customPlaylists.length) {
            html += `<div class="section-title" style="margin-top:24px;">📀 Your Playlists</div>`;
            for(let pl of customPlaylists) {
                html += `<div style="margin-bottom:20px;"><div style="font-weight:bold;">${pl.name}</div><div style="display:flex; gap:10px; overflow-x:auto;">`;
                for(let t of pl.tracks) {
                    html += `<div style="min-width:120px; background:var(--surface); border-radius:16px; padding:8px;"><img src="${t.cover}" style="width:80px; border-radius:12px;"><div style="font-size:12px;">${t.title}</div></div>`;
                }
                html += `</div></div>`;
            }
        }
        container.innerHTML = html;
    }
    window.playTrack = playTrack;
    window.addToFav = (id) => {
        const all = getAllTracksFlat();
        const track = all.find(t=>t.id===id);
        if(track) {
            if(favorites.has(id)) favorites.delete(id);
            else favorites.add(id);
            saveData();
            updateStatsUI();
            renderTrackGrid();
        }
    };
    window.addToPlaylist = (track) => { addToPlaylist(track); };

    // ------------------------------
    // 12. Init Event Listeners & UI
    // ------------------------------
    document.addEventListener('DOMContentLoaded', () => {
        loadStorage();
        updateMoodByTime();
        setInterval(updateMoodByTime, 60000);
        renderTrackGrid();
        renderTimeline();
        updateStatsUI();
        document.getElementById('statsBtn').onclick = () => {
            const panel = document.getElementById('statsPanel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        };
        document.getElementById('vizBtn').onclick = startVisualizer;
        document.getElementById('closeVizBtn').onclick = stopVisualizer;
        document.getElementById('shareBtn').onclick = generateShareCard;
        document.getElementById('speedUp').onclick = () => setSpeed(currentSpeed + 0.1);
        document.getElementById('speedDown').onclick = () => setSpeed(currentSpeed - 0.1);
        document.getElementById('crossfadeToggle').onclick = () => enableCrossfade(!crossfadeEnabled);
        document.getElementById('createPlaylistBtn').onclick = createPlaylist;
        document.getElementById('miniPlayPause').onclick = togglePlay;
        document.getElementById('miniPrev').onclick = prevTrack;
        document.getElementById('miniNext').onclick = nextTrack;
        window.addEventListener('keydown', handleKey);
        // initial dummy audio setup
        initAudio();
        if(masterLibrary.length) playTrack(0);
    });
</script>
</body>
